name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # postinstall runs `prisma generate`, which requires the datasource
          # env vars to exist (it never connects — dummy values are fine).
          DATABASE_URL: "postgresql://build:build@localhost:5432/build"
          DIRECT_URL: "postgresql://build:build@localhost:5432/build"

      - name: Build production bundle
        run: npm run build
        env:
          # Hostinger serves only the static frontend; the Express API runs on
          # Vercel (see vercel.json + README). Bake its URL into the bundle.
          VITE_API_URL: https://construction-react-flax.vercel.app

      - name: Upload dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: public_html/
          dangerous-clean-slate: false
